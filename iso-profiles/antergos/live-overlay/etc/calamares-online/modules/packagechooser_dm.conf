---
mode: required

method: netinstall-add

labels:
    step: "Display Manager"
    step[de]: "Display Manager"

default: SDDM

items:
    - id: SDDM
      name: sddm
      description: "QML-based display manager (KDE default)"
      screenshot: ""
      netinstall:
        name: "SDDM"
        selected: true
        critical: false
        packages:
          - sddm
          - sddm-dinit
          - pixie-sddm-git

    - id: LightDM
      name: lightdm
      description: "Cross-desktop display manager (GTK)"
      screenshot: ""
      netinstall:
        name: "LightDM"
        selected: true
        critical: false
        packages:
          - lightdm
          - lightdm-dinit

    - id: LXDM
      name: lxdm
      description: "Lightweight display manager (LXDE)"
      screenshot: ""
      netinstall:
        name: "LXDM"
        selected: true
        critical: false
        packages:
          - lxdm
          - lxdm-dinit

    - id: greetd
      name: greetd
      description: "Minimal display manager (recommended for COSMIC)"
      screenshot: ""
      netinstall:
        name: "greetd"
        selected: true
        critical: false
        packages:
          - greetd
          - greetd-dinit

    - id: LY
      name: ly
      description: "Minimal TUI display manager"
      screenshot: ""
      netinstall:
        name: "LY"
        selected: true
        critical: false
        packages:
          - ly
          - ly-dinit
